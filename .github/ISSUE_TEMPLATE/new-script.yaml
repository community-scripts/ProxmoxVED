---
name: 🛠️ New Script
description: New Script proposal.
labels: [task]
body:
  - type: markdown
    attributes:
      value: |
        # 🛠️ **New Script**
        Create an Issue when you want to merge a new Script. The name of the Issue must be the same as your APP.sh file. (Example: SnipeIT, snipeit.sh; Alpine-Docker, alpine-docker.sh)

        DevScripts takes every kind of script: application containers for Proxmox VE and Incus, VMs, add-ons and host tools.
  - type: input
    id: task_summary
    attributes:
      label: Name of the Script
      placeholder: e.g., SnipeIT
    validations:
      required: true
  - type: dropdown
    id: script_type
    attributes:
      label: Script Type
      description: What type of script is this? A CT script creates its container on Proxmox VE and on Incus.
      options:
        - CT (LXC Container)
        - VM (Virtual Machine)
        - Addon (tools/addon)
        - PVE Tool (tools/pve)
        - Other (set the script path below)
    validations:
      required: true
  - type: input
    id: script_path
    attributes:
      label: Script path
      description: Only needed when the file is not `<type folder>/<name>.sh`.
      placeholder: e.g., tools/arr-stack.sh or vm/umbrel-os-vm.sh
  - type: dropdown
    id: runs_on
    attributes:
      label: Where does it run?
      description: Addons and tools only. Left empty, it is derived from the script.
      options:
        - Proxmox VE host
        - Inside an LXC or VM
        - Proxmox Backup Server
        - Proxmox Mail Gateway
        - Proxmox Datacenter Manager
  - type: dropdown
    id: arm64_support
    attributes:
      label: Does this script support arm64?
      description: amd64 support is assumed.
      options:
        - arm64 supported
        - arm64 not tested
        - arm64 not supported
    validations:
      required: true
  - type: checkboxes
    id: tested_on
    attributes:
      label: Tested on
      description: Application containers run on Proxmox VE and Incus. Tick what you actually tested.
      options:
        - label: Proxmox VE
        - label: Incus
  - type: textarea
    id: task_details
    attributes:
      label: 📋 Script Details
      placeholder: Explain what is needed or special about this script
    validations:
      required: true
