name: Discord thread lifecycle

on:
  issues:
    types:
      - labeled
      - unlabeled
      - closed
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to act on
        required: true
        type: string
      mode:
        description: Lifecycle step to run
        required: true
        type: choice
        options:
          - ready
          - hold
          - defer
          - migrate
          - delete

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: discord-thread-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Collapse the trigger into one lifecycle mode plus the issue facts every
  # downstream step needs, so nothing below re-derives the label logic.
  # ---------------------------------------------------------------------------
  route:
    runs-on: ubuntu-latest
    if: github.repository == 'community-scripts/ProxmoxVED'
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      issue_number: ${{ steps.route.outputs.issue_number }}
      issue_title: ${{ steps.route.outputs.issue_title }}
      issue_url: ${{ steps.route.outputs.issue_url }}
      issue_locked: ${{ steps.route.outputs.issue_locked }}
      thread_name: ${{ steps.route.outputs.thread_name }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Determine mode
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, '|') }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_LOCKED: ${{ github.event.issue.locked }}
        run: |
          mode=noop

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$INPUT_MODE"
            ISSUE_NUMBER="$INPUT_ISSUE"
            META=$(gh api "/repos/$REPO/issues/$ISSUE_NUMBER")
            ISSUE_TITLE=$(jq -r '.title' <<<"$META")
            ISSUE_URL=$(jq -r '.html_url' <<<"$META")
            ISSUE_LOCKED=$(jq -r '.locked' <<<"$META")
          elif [ "$EVENT_ACTION" = "closed" ]; then
            mode=delete
          else
            case "$EVENT_ACTION:$EVENT_LABEL" in
              "labeled:Ready For Testing")               mode=ready ;;
              "unlabeled:Ready For Testing")             mode=hold ;;
              "labeled:deferred")                        mode=defer ;;
              "labeled:Started Migration To ProxmoxVE")  mode=migrate ;;
            esac

            # Removing 'Ready For Testing' usually accompanies a deferral or a
            # migration; those modes own the messaging, so drop the duplicate.
            if [ "$mode" = "hold" ] && printf '%s' "|$ISSUE_LABELS|" \
              | grep -qE '\|(deferred|Migration To ProxmoxVE|Started Migration To ProxmoxVE)\|'; then
              mode=noop
            fi
          fi

          echo "Mode: $mode (event=$EVENT_NAME action=$EVENT_ACTION label=$EVENT_LABEL issue=$ISSUE_NUMBER)"

          {
            echo "mode=$mode"
            echo "issue_number=$ISSUE_NUMBER"
            echo "issue_url=$ISSUE_URL"
            echo "issue_locked=${ISSUE_LOCKED:-false}"
            printf 'issue_title<<ISSUE_TITLE_EOF\n%s\nISSUE_TITLE_EOF\n' "$ISSUE_TITLE"
            printf 'thread_name<<THREAD_NAME_EOF\nWanted Tester for %s\nTHREAD_NAME_EOF\n' "$ISSUE_TITLE"
          } >> "$GITHUB_OUTPUT"

  lifecycle:
    runs-on: ubuntu-latest
    needs: route
    if: needs.route.outputs.mode != 'noop'
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
      DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      MODE: ${{ needs.route.outputs.mode }}
      THREAD_NAME: ${{ needs.route.outputs.thread_name }}
      ISSUE_NUMBER: ${{ needs.route.outputs.issue_number }}
      ISSUE_TITLE: ${{ needs.route.outputs.issue_title }}
      ISSUE_URL: ${{ needs.route.outputs.issue_url }}
      TAG_TESTING: Testing
      TAG_HOLD: On Hold
      TAG_DEFERRED: Deferred
      TAG_MIGRATING: Migrating
      HELPER: .github/workflows/scripts/discord-thread.sh
    steps:
      - name: Checkout helper script
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/workflows/scripts
          sparse-checkout-cone-mode: false

      - name: Resolve Discord thread
        id: thread
        run: |
          chmod +x "$HELPER"
          id=$("$HELPER" resolve "$ISSUE_NUMBER" "$THREAD_NAME")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          if [ -n "$id" ]; then
            echo "Resolved thread: $id"
          else
            echo "No existing thread for: $THREAD_NAME"
          fi

      # -----------------------------------------------------------------------
      # Ready For Testing
      # -----------------------------------------------------------------------
      - name: Resolve the script to test
        if: env.MODE == 'ready'
        run: |
          ISSUE_BODY=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq '.body // ""')
          RAW=https://raw.githubusercontent.com/community-scripts/ProxmoxVED/main

          # First answered line under an issue form heading.
          field() {
            printf '%s\n' "$ISSUE_BODY" | tr -d '\r' \
              | sed -n "/^###[[:space:]]*$1/,/^###/p" \
              | sed '1d;/^###/d;/^[[:space:]]*$/d;/^_No response_$/d' | head -n1
          }

          NAME_RAW=$(field 'Name of the Script')
          if [ -z "$NAME_RAW" ]; then
            NAME_RAW="$ISSUE_TITLE"
          fi
          SLUG=$(printf '%s' "$NAME_RAW" | tr -d '\r' | tr '[:upper:]' '[:lower:]' | sed 's/[[:space:]]\+/-/g')

          case "$(field 'Script Type')" in
            CT*)         SCRIPT_TYPE="ct" ;;
            VM*)         SCRIPT_TYPE="vm" ;;
            Addon*)      SCRIPT_TYPE="addon" ;;
            "PVE Tool"*) SCRIPT_TYPE="pve" ;;
            Other*)      SCRIPT_TYPE="other" ;;
            *) if [[ "$SLUG" == *"-vm"* ]]; then SCRIPT_TYPE="vm"; else SCRIPT_TYPE="ct"; fi ;;
          esac

          SCRIPT_PATH=$(field 'Script path' | tr -d '[:space:]' | sed 's|^/||')
          if [[ ! "$SCRIPT_PATH" =~ ^[A-Za-z0-9._/-]+\.sh$ || "$SCRIPT_PATH" == *..* ]]; then
            SCRIPT_PATH=""
          fi
          if [ -z "$SCRIPT_PATH" ] && [[ "$SLUG" =~ ^[a-z0-9._-]+$ ]]; then
            case "$SCRIPT_TYPE" in
              ct)    SCRIPT_PATH="ct/${SLUG}.sh" ;;
              vm)    SCRIPT_PATH="vm/${SLUG}.sh"
                     curl -fsI "$RAW/$SCRIPT_PATH" >/dev/null 2>&1 || SCRIPT_PATH="vm/${SLUG%-vm}-vm.sh" ;;
              addon) SCRIPT_PATH="tools/addon/${SLUG}.sh" ;;
              pve)   SCRIPT_PATH="tools/pve/${SLUG}.sh" ;;
            esac
          fi

          if [ -z "$SCRIPT_PATH" ] || ! curl -fsSL --retry 3 -o script.sh "$RAW/$SCRIPT_PATH"; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body \
              "⚠️ \`${SCRIPT_PATH:-no script path}\` is not on \`main\`, so there is no test command to post. Fill in **Script path** in the issue or fix the name, then add \`Ready For Testing\` again."
            exit 1
          fi

          APPLIANCE=$(basename "$SCRIPT_PATH" | grep -oE '(^|-)(pbs|pmg|pdm)([0-9-]|\.sh$)' | grep -oE 'pbs|pmg|pdm' | head -n1 || true)
          if [[ "$SCRIPT_TYPE" == ct || "$SCRIPT_TYPE" == vm ]]; then
            RUNS_ON="pve"
          else
            case "$(field 'Where does it run?')" in
              "Proxmox VE host")            RUNS_ON="pve" ;;
              "Inside an LXC or VM")        RUNS_ON="guest" ;;
              "Proxmox Backup Server")      RUNS_ON="pbs" ;;
              "Proxmox Mail Gateway")       RUNS_ON="pmg" ;;
              "Proxmox Datacenter Manager") RUNS_ON="pdm" ;;
              *)
                if [[ "$SCRIPT_PATH" == tools/pve/* ]]; then
                  RUNS_ON="${APPLIANCE:-pve}"
                elif sed -e 's/^[[:space:]]*#.*//' -e 's/command -v [^[:space:]]*//g' script.sh \
                  | grep -qE '(^|[[:space:];&|(`$])(pct|qm|pveam|pvesm|pvesh|pveversion)[[:space:]]'; then
                  RUNS_ON="pve"
                elif [ -n "$APPLIANCE" ]; then
                  RUNS_ON="$APPLIANCE"
                elif [[ "$SCRIPT_PATH" == tools/addon/* ]]; then
                  RUNS_ON="guest"
                else
                  RUNS_ON="unknown"
                fi ;;
            esac
          fi

          {
            echo "SLUG=$SLUG"
            echo "SCRIPT_TYPE=$SCRIPT_TYPE"
            echo "SCRIPT_PATH=$SCRIPT_PATH"
            echo "RUNS_ON=$RUNS_ON"
          } >> "$GITHUB_ENV"
          echo "Resolved $SCRIPT_TYPE script $SCRIPT_PATH, runs on: $RUNS_ON"

      - name: Build testing message
        if: env.MODE == 'ready'
        run: |
          case "$RUNS_ON:$SCRIPT_TYPE" in
            pve:ct)  WHERE="in the Proxmox VE shell (or on an Incus host) to create a container" ;;
            pve:vm)  WHERE="in the Proxmox VE shell to create a VM" ;;
            pve:*)   WHERE="in the Proxmox VE shell" ;;
            guest:*) WHERE="inside the LXC or VM that should get it" ;;
            pbs:*)   WHERE="in the Proxmox Backup Server shell" ;;
            pmg:*)   WHERE="in the Proxmox Mail Gateway shell" ;;
            pdm:*)   WHERE="in the Proxmox Datacenter Manager shell" ;;
            *)       WHERE="as described in the issue" ;;
          esac

          {
            printf 'The %s script is ready for testing. Run it %s:\n' "$ISSUE_TITLE" "$WHERE"
            printf '```\nbash -c "$(curl -fsSL https://raw.githubusercontent.com/community-scripts/ProxmoxVED/main/%s)"\n```\n' "$SCRIPT_PATH"
          } > testing.md

          if [ "$SCRIPT_TYPE" != "pve" ]; then
            JSON=$(curl -fsSL "https://github.com/community-scripts/ProxmoxVED/raw/main/json/${SLUG}.json" 2>/dev/null || echo '{}')

            username=$(printf '%s' "$JSON" | jq -r '.default_credentials.username // empty' 2>/dev/null || true)
            password=$(printf '%s' "$JSON" | jq -r '.default_credentials.password // empty' 2>/dev/null || true)
            if [ -n "$username" ] || [ -n "$password" ]; then
              printf '\nDefault credentials:\n' >> testing.md
              if [ -n "$username" ]; then
                printf 'Username: %s\n' "$username" >> testing.md
              fi
              if [ -n "$password" ]; then
                printf 'Password: %s\n' "$password" >> testing.md
              fi
            fi

            NOTES=$(printf '%s' "$JSON" | jq -r '.notes[]?.text // empty' 2>/dev/null || true)
            if [ -n "$NOTES" ]; then
              printf '\n%s\n' "$NOTES" >> testing.md
            fi
          fi

          if [[ "$SCRIPT_TYPE" == ct || "$SCRIPT_TYPE" == vm ]]; then
            printf '\nNote: This is not in the official repo yet—it'"'"'s just a dev version! After merging into ProxmoxVE, it will need to be recreated.\n' >> testing.md
          else
            printf '\nNote: This is not in the official repo yet—it'"'"'s just a dev version!\n' >> testing.md
          fi

          cp testing.md discord.md
          printf '\nDiscussion & issue tracking:\n%s\n' "$ISSUE_URL" >> discord.md

          echo "--- Discord message ---"
          cat discord.md

      - name: Create Discord thread
        id: create
        if: env.MODE == 'ready' && steps.thread.outputs.id == ''
        run: |
          id=$("$HELPER" create "$THREAD_NAME" discord.md "$TAG_TESTING")
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::Discord thread creation returned no id"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Created thread: $id"

      - name: Comment testing instructions on issue
        if: steps.create.outputs.id != ''
        env:
          THREAD_ID: ${{ steps.create.outputs.id }}
        run: |
          {
            cat testing.md
            printf '\nDiscord testing thread: https://discord.com/channels/%s/%s\n' "$DISCORD_GUILD_ID" "$THREAD_ID"
            printf '\n<!-- discord-thread-id: %s -->\n' "$THREAD_ID"
          } > comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file comment.md

      - name: Reopen existing thread for testing
        if: env.MODE == 'ready' && steps.thread.outputs.id != ''
        env:
          THREAD_ID: ${{ steps.thread.outputs.id }}
        run: |
          {
            printf '▶️ **Testing has resumed** — the `Ready For Testing` label is back on the issue.\n\n'
            cat testing.md
            printf '\n🔗 %s\n' "$ISSUE_URL"
          } > notice.md
          "$HELPER" post "$THREAD_ID" notice.md
          "$HELPER" state "$THREAD_ID" false false "$TAG_TESTING"

          # Also re-anchors the thread id on issues whose thread predates the marker.
          {
            printf '▶️ Testing resumed. Discord thread: https://discord.com/channels/%s/%s\n' "$DISCORD_GUILD_ID" "$THREAD_ID"
            printf '\n<!-- discord-thread-id: %s -->\n' "$THREAD_ID"
          } > comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file comment.md

      - name: Unlock issue
        if: env.MODE == 'ready' && needs.route.outputs.issue_locked == 'true'
        run: |
          gh api --method DELETE "/repos/$REPO/issues/$ISSUE_NUMBER/lock"

      - name: Push script JSON to PocketBase
        if: env.MODE == 'ready' && env.SCRIPT_TYPE != 'pve' && env.SCRIPT_TYPE != 'other'
        run: |
          gh workflow run push_json_to_pocketbase.yml --repo "$REPO" -f script_slug="$SLUG"

      # -----------------------------------------------------------------------
      # Hold / defer / migrate
      # -----------------------------------------------------------------------
      - name: Warn about missing thread
        if: steps.thread.outputs.id == '' && env.MODE != 'ready'
        run: echo "::warning::No Discord thread found for '$THREAD_NAME' — nothing to update."

      - name: Collect latest issue update
        if: env.MODE == 'hold' || env.MODE == 'defer'
        run: |
          gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json comments --jq '
            .comments
            | map(select((.author.login // "") | test("\\[bot\\]$|^github-actions$") | not))
            | last | .body // ""' > last_update.txt

          if [ ! -s last_update.txt ]; then
            gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq '.body // ""' > last_update.txt
          fi

          if [ "$(wc -c < last_update.txt)" -gt 800 ]; then
            head -c 800 last_update.txt > trimmed.txt
            printf '\n…\n' >> trimmed.txt
            mv trimmed.txt last_update.txt
          fi

      - name: Pause testing in Discord thread
        if: env.MODE == 'hold' && steps.thread.outputs.id != ''
        env:
          THREAD_ID: ${{ steps.thread.outputs.id }}
        run: |
          {
            printf '⚠️ **Testing paused** — the `Ready For Testing` label was removed because there may be problems with this script.\n\n'
            printf 'The thread stays open, but please hold off on testing the version above until it is marked ready again.\n\n'
            printf 'Latest update from the issue:\n\n'
            cat last_update.txt
            printf '\n\n🔗 %s\n' "$ISSUE_URL"
          } > notice.md
          "$HELPER" post "$THREAD_ID" notice.md
          "$HELPER" state "$THREAD_ID" false false "$TAG_HOLD"

      - name: Defer testing in Discord thread
        if: env.MODE == 'defer' && steps.thread.outputs.id != ''
        env:
          THREAD_ID: ${{ steps.thread.outputs.id }}
        run: |
          {
            printf '⏸️ **This script has been deferred** and is postponed indefinitely.\n\n'
            printf 'This thread is locked. It will reopen if the `Ready For Testing` label is added to the issue again.\n\n'
            printf 'Latest update from the issue:\n\n'
            cat last_update.txt
            printf '\n\n🔗 %s\n' "$ISSUE_URL"
          } > notice.md
          "$HELPER" post "$THREAD_ID" notice.md
          "$HELPER" state "$THREAD_ID" true true "$TAG_DEFERRED"

      - name: Comment and lock deferred issue
        if: env.MODE == 'defer'
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "⏸️ This script has been **deferred**. The Discord testing thread has been locked. Re-add the \`Ready For Testing\` label to resume testing."
          gh api --method PUT "/repos/$REPO/issues/$ISSUE_NUMBER/lock" -f lock_reason=resolved

      - name: Announce migration in Discord thread
        if: env.MODE == 'migrate' && steps.thread.outputs.id != ''
        env:
          THREAD_ID: ${{ steps.thread.outputs.id }}
        run: |
          # The manual label and the dispatch from move-to-main-repo can both land;
          # a locked thread means the announcement already went out.
          if [ "$("$HELPER" locked "$THREAD_ID")" = "true" ]; then
            echo "Thread already locked — migration was announced before."
            exit 0
          fi

          PR=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json comments \
            --jq '[.comments[].body // "" | scan("community-scripts/ProxmoxVE#([0-9]+)")[]] | last // empty')

          {
            printf '🚚 **Migration to ProxmoxVE has started.**\n\n'
            if [ -n "$PR" ]; then
              printf 'A pull request is open in the main repository: https://github.com/community-scripts/ProxmoxVE/pull/%s\n\n' "$PR"
            fi
            printf 'Testing in ProxmoxVED is finished — this thread is locked and will be removed once the migration is complete. Please continue the discussion on the pull request.\n\n'
            printf '🔗 %s\n' "$ISSUE_URL"
          } > notice.md
          "$HELPER" post "$THREAD_ID" notice.md
          "$HELPER" state "$THREAD_ID" true true "$TAG_MIGRATING"

      # -----------------------------------------------------------------------
      # Issue closed -> the thread has served its purpose
      # -----------------------------------------------------------------------
      - name: Delete Discord thread
        if: env.MODE == 'delete' && steps.thread.outputs.id != ''
        env:
          THREAD_ID: ${{ steps.thread.outputs.id }}
        run: |
          "$HELPER" delete "$THREAD_ID"
          echo "Deleted thread: $THREAD_ID"
